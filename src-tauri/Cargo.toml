[package]
name = "drawnix-desktop"
version = "0.5.0"
description = "Drawnix local desktop whiteboard"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
opt-level = "s"
strip = true
